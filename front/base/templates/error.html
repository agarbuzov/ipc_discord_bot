{% extends "base.html" %}

{% block content %}
    <div class="container-fluid pt-4 px-4">
        <div class="row vh-100 bg-secondary rounded align-items-center justify-content-center mx-0">
            <div class="col-md-6 text-center p-4">
                <i class="bi bi-exclamation-triangle display-1 text-primary"></i>
                <h1 class="display-1 fw-bold">{{ error.code }}</h1>
                <h1 class="mb-4">{{ error.name }}</h1>
                <p class="mb-4">{{ error.description }}</p>
                <a class="btn btn-primary rounded-pill py-3 px-5" href="{% if request.referrer %}{{ request.referrer }}{% else %}{{ url_for("index") }}{% endif %}">Go Back</a>
            </div>
        </div>
    </div>
{% endblock %}

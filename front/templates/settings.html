{% extends 'base.html' %}
{% block content %}

<div style="display: grid; grid-template-rows: 100px 1fr; gap:15px;">
    <div class="d-flex justify-content-between align-items-center">
        <span class="display-3 mb-1">Settings</span>
    </div>
    <div>
        <div class="container float-start">

            <form action="">

                <img src="{{ url_for('static', path='images/logo.jpg') }}"
                     class="img-thumbnail img-fluid rounded float-start mb-3"
                     style="width: 250px; height: 250px; object-fit: cover;" id="filePreview">
                <div class="input-group mb-3">
                    <label class="input-group-text" for="inputGroupFile01">Avatar</label>
                    <input type="file" class="form-control" id="inputGroupFile01" onchange="loadFile(event)">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-default">Nickname</span>
                    <input type="text" class="form-control" aria-label="Sizing example input"
                           aria-describedby="inputGroup-sizing-default" value="Gachips">
                </div>
                <div class="float-left d-flex">
                    <button type="button" class="my-1 btn btn-danger remove px-4 me-3">Cancel</button>
                    <button type="button" class="my-1 btn btn-success px-4">Save</button>
                </div>
            </form>

        </div>
    </div>
</div>


<script>
    var loadFile = function(event) {
    var output = document.getElementById('filePreview');
    output.src = URL.createObjectURL(event.target.files[0]);
    output.onload = function() {
      URL.revokeObjectURL(output.src) // free memory
    }
  };
</script>

{% endblock %}

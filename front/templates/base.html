<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gachips</title>
    {% block styles %}
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
        <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
              crossorigin="anonymous">
    {% endblock %}
</head>
<body>
<main>
    {% include 'parts/topnav.html' %}
    <div class="content_container">
        {% block content %}

        {% endblock %}
    </div>
</main>
{% include 'parts/sidenav.html' %}
</body>
</html>
{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
            crossorigin="anonymous"></script>
    <script src="{{ url_for('static', path='js/jquery.js') }}"></script>
    <script>
        let delayTimer;
        const navBar = document.getElementById("mySidenav")

        navBar.addEventListener('mouseover', () => {
            navBar.classList.add("wrap_nav_open")
        })

        navBar.addEventListener('mouseout', () => {
            navBar.classList.remove("wrap_nav_open")
        })

        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
        $(document).click(function(event) {
            console.log($(event.target))
        });
        $('#search').on('input', function () {
            let query = $(this).val()
            if (query) {
                clearTimeout(delayTimer)
                delayTimer = setTimeout(function () {
                    $.ajax({
                        url: '/search/',
                        data: {query: query}
                    }).done(function (response) {
                        $('#search-result').empty()
                        $.each(response, function (k, v) {
                            let option = `<div data-url="${v.url}">${v.title}</div>`
                            $(option).appendTo('#search-result').on('click', function () {
                                $.ajax({
                                    url: '/play/',
                                    data: {query: this.dataset.url}
                                })
                            })
                        })
                    })
                }, 1000);
            }
        })
    </script>
{% endblock %}

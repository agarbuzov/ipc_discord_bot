{% extends 'base.html' %}

{% block content %}
    <div style="display: grid; grid-template-rows: 100px 100px 1fr;">
        <div class="d-flex justify-content-between align-items-center">

            <span class="display-3 mb-1">History</span>
            <form>
                <div class="form-row">
                    <input class="form-control form-control-lg" type="text" placeholder="Search">
                </div>
            </form>
        </div>
        <span class="h5 mb-1 mx-2">List of 50 last songs </span>
        <table class="table">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Date</th>
                <th scope="col">User</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            {% for record in history %}
                <tr>
                    <th class="align-middle" scope="row">{{ loop.index }}</th>
                    <td class="align-middle">
                        <a class="link-secondary" href="{{ record.url }}">{{ record.track }}</a>
                    </td>
                    <td class="align-middle">{{ record.type }}</td>
                    <td class="align-middle">{{ record.date.strftime('%d %B %H:%M') }}</td>
                    <td class="align-middle">@{{ record.user.username }}</td>
                    <td>
                        <button type="button" class="btn btn-outline-secondary">Play Again ↻</button>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}

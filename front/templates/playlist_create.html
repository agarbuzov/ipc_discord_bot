{% extends 'base.html' %}
{% block content %}
    <div style="display: grid; grid-template-rows: 100px 1fr; gap:15px;">
        <div class="d-flex justify-content-between align-items-center">
            <span class="display-4 mb-1">Create Playlist</span>

        </div>

        <div>
            <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
            <div class="container float-start">

                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">Playlist name</span>
                    </div>
                    <input type="text" class="form-control" placeholder="Playlist name">
                </div>


                <div class="mb-3">
                    <input class="form-control" type="file" id="formFile">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">1</span>
                    <input type="text" class="form-control" placeholder="https://www.youtube.com/...">
                </div>


                <input type="hidden" value="1" id="total_chq">

                <div id='new_chq'>

                </div>


                <div class='justify-content-between align-items-center d-flex'>

                    <div>
                        <button type="button" class="btn btn-secondary add mr-3">Add new</button>
                        <button type="button" class="btn btn-danger remove">Remove last</button>
                    </div>

                    <button type="button" class="btn btn-success">Create Playlist</button>


                </div>

            </div>

            <input type="hidden" value="1" id="total_chq">

        </div>

    </div>
{% endblock %}

{% block scripts %}
    {{ super() }}

    <script type="text/javascript">

        $('.add').on('click', add);
        $('.remove').on('click', remove);

        function add() {
            var new_chq_no = parseInt($('#total_chq').val()) + 1;
            var new_input = "<input type='text' placeholder='" + new_chq_no + "' id='new_" + new_chq_no + "'>";

            var new_input2 = "<div class='input-group mb-3'id='new_" + new_chq_no + "'><span class='input-group-text'>" + new_chq_no + "</span><input type='text' class='form-control' placeholder='https://www.youtube.com/...'></div>";

            $('#new_chq').append(new_input2);

            $('#total_chq').val(new_chq_no);
        }

        function remove() {
            var last_chq_no = $('#total_chq').val();

            if (last_chq_no > 1) {
                $('#new_' + last_chq_no).remove();
                $('#total_chq').val(last_chq_no - 1);
            }
        }

    </script>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
            integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
            crossorigin="anonymous"></script>

    <script type="application/javascript">
        $('input[type="file"]').change(function (e) {
            var fileName = e.target.files[0].name;
            $('.custom-file-label').html(fileName);
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
            crossorigin="anonymous"></script>
{% endblock %}
